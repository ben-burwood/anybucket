services:
  anybucket:
    build: .
    # image: ghcr.io/ben-burwood/anybucket:latest
    ports:
      - "8080:8080"
    environment:
      ANYBUCKET_MASTER_KEY: ${ANYBUCKET_MASTER_KEY:?set ANYBUCKET_MASTER_KEY in .env}
    volumes:
      - ./anybucket-config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
