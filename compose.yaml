services:
  anybucket:
    build: .
    # image: ghcr.io/ben-burwood/anybucket:latest
    ports:
      - "8080:8080"
    environment:
      # Normal mode: required — encrypts connection secrets at rest. Set it in .env.
      ANYBUCKET_MASTER_KEY: ${ANYBUCKET_MASTER_KEY:-}
      # Config mode: credentials referenced from anybucket.toml via `access_key_id_env` / `secret_access_key_env` are read from the container environment.
      # AWS_PROD_ACCESS_KEY_ID: ${AWS_PROD_ACCESS_KEY_ID:-}
      # AWS_PROD_SECRET: ${AWS_PROD_SECRET:-}
    volumes:
      # Drop an `anybucket.toml` in ./config to enable CONFIG MODE.
      - ./config/anybucket.toml:/config/anybucket.toml:ro
