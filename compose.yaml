services:
  anybucket:
    build: .
    # image: ghcr.io/ben-burwood/anybucket:latest
    ports:
      - "8080:8080"
    environment:
      # Normal mode: required — encrypts connection secrets at rest. Set it in .env.
      ANYBUCKET_MASTER_KEY: ${ANYBUCKET_MASTER_KEY:-}
      # Config mode: secrets referenced from anybucket.toml via `secret_access_key_env` are read from the container environment.
      # AWS_PROD_SECRET: ${AWS_PROD_SECRET:-}
    volumes:
      # Mounted at /config.
      # Drop an `anybucket.toml` in ./config to enable CONFIG MODE.
      - ./config:/config
