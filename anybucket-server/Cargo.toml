[package]
name = "anybucket-server"
description = "Self-hosted web server for AnyBucket (axum over anybucket-core)"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "anybucket-server"
path = "src/main.rs"

[dependencies]
anybucket-core = { path = "../anybucket-core" }

# HTTP
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# The cached client type threaded through core ops.
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encrypted secret store at rest
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
