[package]
name = "anybucket"
description = "Desktop explorer for S3-compatible object stores"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "anybucket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anybucket-core = { path = "../anybucket-core" }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

# Referenced directly for the cached client type passed into the core tasks.
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }

# The `Serialize` bound on the Channel→ProgressSink bridge helper.
serde = "1"

# Async: mutex-guarded state + local-disk upload enumeration.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }

# Desktop secret store (OS keychain)
keyring-core = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
