[package]
name = "anybucket"
description = "Desktop explorer for S3-compatible object stores"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "anybucket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anybucket-core = { path = "../anybucket-core" }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

# Referenced directly for the cached client type passed into the core tasks.
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }

# Async: mutex-guarded state + local-disk upload enumeration.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }

# Desktop secret store (OS keychain)
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
