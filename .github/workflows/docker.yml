name: Docker

on:
  release:
    types: [published]

jobs:
  docker:
    name: Build and Push Docker image to GHCR
    uses: ben-burwood/.actions/.github/workflows/docker-build-push.yml@main
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
