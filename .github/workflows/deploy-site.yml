name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: ben-burwood/.actions/.github/workflows/deploy-site.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
