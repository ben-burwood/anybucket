name: Publish to WinGet

on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release:
        description: "Release Tag"
        required: true

jobs:
  winget:
    runs-on: windows-latest
    # Manual runs always proceed. Automatic runs only after Publish succeeds
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Publish AnyBucket update to WinGet
        shell: pwsh
        run: |
          $tag = "${{ inputs.release || github.event.workflow_run.head_branch }}"      # e.g. app-v0.3.1
          $version = $tag -replace '^app-v', ''                                        # e.g. 0.3.1

          $installerUrl = "https://github.com/ben-burwood/anybucket/releases/download/$tag/AnyBucket_${version}_x64-setup.exe"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update BenBurwood.AnyBucket `
            --version $version `
            --urls "$installerUrl" `
            --submit `
            --token "${{ secrets.WINGET_TOKEN }}"
